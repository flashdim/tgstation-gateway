name: tgstation-gateway

services:
  player:
    image: ${GATEWAY_IMAGE:-ghcr.io/flashdim/tgstation-gateway:latest}
    platform: linux/amd64
    init: true
    shm_size: 2gb
    security_opt:
      - seccomp=./seccomp.json
    environment:
      BYOND_SERVER: ${BYOND_SERVER:-}
      BYOND_WEBVIEW2_GPU: ${BYOND_WEBVIEW2_GPU:-0}
      SELKIES_MANUAL_WIDTH: ${SELKIES_MANUAL_WIDTH:-1920}
      SELKIES_MANUAL_HEIGHT: ${SELKIES_MANUAL_HEIGHT:-1080}
    ports:
      - "127.0.0.1:${GATEWAY_PORT:-8080}:8080"
