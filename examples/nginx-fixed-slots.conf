# Example for exactly two accounts. Configure certificates and separate
# password files as described in README.md before enabling this server.
server {
    listen 443 ssl;
    server_name play.example.org;
    access_log off;

    if ($host != play.example.org) { return 404; }

    ssl_certificate /etc/nginx/gateway/fullchain.pem;
    ssl_certificate_key /etc/nginx/gateway/privkey.pem;

    location = /LGplayer01 { return 404; }
    location = /LGplayer02 { return 404; }

    location ^~ /LGplayer01/ {
        auth_basic "LGplayer01";
        auth_basic_user_file /etc/nginx/gateway/LGplayer01.htpasswd;
        proxy_pass http://127.0.0.1:8080;
        proxy_http_version 1.1;
        proxy_read_timeout 3600s;
        proxy_set_header Host $http_host;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
        proxy_set_header Authorization "";
    }

    location ^~ /LGplayer02/ {
        auth_basic "LGplayer02";
        auth_basic_user_file /etc/nginx/gateway/LGplayer02.htpasswd;
        proxy_pass http://127.0.0.1:8081;
        proxy_http_version 1.1;
        proxy_read_timeout 3600s;
        proxy_set_header Host $http_host;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
        proxy_set_header Authorization "";
    }

    location / { return 404; }
}
