name: ${GATEWAY_DEPLOYMENT_ID:-tgportals}

services:
  landing:
    image: ${GATEWAY_LANDING_IMAGE:-ghcr.io/flashdim/tgstation-gateway-landing:latest}
    init: true
    restart: unless-stopped
    read_only: true
    cap_drop: [ALL]
    security_opt: [no-new-privileges:true]
    environment:
      GATEWAY_PLAY_HOST: ${GATEWAY_PLAY_HOST:?Set GATEWAY_PLAY_HOST to your Traefik hostname}
      GATEWAY_PLAY_SCHEME: https
      GATEWAY_SLOT_COUNT: ${GATEWAY_SLOT_COUNT:-4}
      GATEWAY_ACCOUNT_PREFIX: LGplayer
      GATEWAY_SLOT_PATH: /{account}/
      GATEWAY_QUERY_HOST: ${GATEWAY_QUERY_HOST:-}
      GATEWAY_QUERY_PORT: ${GATEWAY_QUERY_PORT:-}
    networks:
      edge:
      landing:
        aliases: [gateway-landing]

  router:
    image: caddy:2.11.9-alpine@sha256:003a97808e781aa9f7e75cc2f43d34d461099031faf5e20faefb9f61126836f0
    restart: unless-stopped
    environment:
      ROUTER_ALIAS: ${GATEWAY_DEPLOYMENT_ID:-tgportals}-router-front
      GATEWAY_DEPLOYMENT_ID: ${GATEWAY_DEPLOYMENT_ID:-tgportals}
    command:
      - sh
      - -ec
      - |
        ROUTER_BIND_IP="$$(getent ahostsv4 "$$ROUTER_ALIAS" | awk 'NR == 1 {print $$1}')"
        if [ -z "$$ROUTER_BIND_IP" ]; then
          echo "Cannot resolve the Traefik-facing router address" >&2
          exit 1
        fi
        export ROUTER_BIND_IP
        exec caddy run --config /etc/caddy/Caddyfile --adapter caddyfile
    configs:
      - source: router_config
        target: /etc/caddy/Caddyfile
    networks:
      edge:
        aliases:
          - ${GATEWAY_DEPLOYMENT_ID:-tgportals}-router-front
      landing:
    labels:
      - traefik.enable=true
      - traefik.docker.network=${GATEWAY_TRAEFIK_NETWORK:-public}
      - traefik.http.routers.${GATEWAY_DEPLOYMENT_ID:-tgportals}.rule=Host(`${GATEWAY_PLAY_HOST:?Set GATEWAY_PLAY_HOST to your Traefik hostname}`)
      - traefik.http.routers.${GATEWAY_DEPLOYMENT_ID:-tgportals}.entrypoints=${GATEWAY_TRAEFIK_ENTRYPOINT:-https}
      - traefik.http.routers.${GATEWAY_DEPLOYMENT_ID:-tgportals}.tls=true
      - traefik.http.routers.${GATEWAY_DEPLOYMENT_ID:-tgportals}.service=${GATEWAY_DEPLOYMENT_ID:-tgportals}
      - traefik.http.services.${GATEWAY_DEPLOYMENT_ID:-tgportals}.loadbalancer.server.port=8080

  manager:
    build:
      context: ..
      dockerfile: examples/manager.Dockerfile
    restart: unless-stopped
    network_mode: none
    read_only: true
    cap_drop: [ALL]
    security_opt: [no-new-privileges:true]
    environment:
      GATEWAY_DEPLOYMENT_ID: ${GATEWAY_DEPLOYMENT_ID:-tgportals}
      GATEWAY_SLOT_COUNT: ${GATEWAY_SLOT_COUNT:-4}
      GATEWAY_TRAEFIK_NETWORK: ${GATEWAY_TRAEFIK_NETWORK:-public}
      GATEWAY_IMAGE: ${GATEWAY_IMAGE:-ghcr.io/flashdim/tgstation-gateway:latest}
      BYOND_SERVER: ${BYOND_SERVER:?Set BYOND_SERVER to your game server host and port}
      SELKIES_WAYLAND: ${SELKIES_WAYLAND:-true}
    volumes:
      - /var/run/docker.sock:/var/run/docker.sock
      - manager_lock:/run/gateway-lock

configs:
  router_config:
    content: |
      (backend_headers) {
          header_up -Cookie
          header_up -Authorization
          header_up -Cf-Access-*
      }
      http://:8080 {
          bind {$$ROUTER_BIND_IP}
          @slot path_regexp slot ^/LGplayer(0[1-9]|[1-9][0-9])/
          handle @slot {
              reverse_proxy {$$GATEWAY_DEPLOYMENT_ID}-player{re.slot.1}:8080 {
                  import backend_headers
              }
          }
          handle {
              reverse_proxy gateway-landing:8000 {
                  import backend_headers
              }
          }
      }

networks:
  edge:
    external: true
    name: ${GATEWAY_TRAEFIK_NETWORK:-public}
  landing:

volumes:
  manager_lock:
