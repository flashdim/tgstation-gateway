services:
  player:
    image: tgstation-gateway-player:local
    platform: linux/amd64
    build:
      context: .
      args:
        BYOND_VERSION: "${BYOND_VERSION:-516.1688}"
        BYOND_SHA256: "${BYOND_SHA256:-}"
    init: true
    shm_size: 2gb
    ports:
      - "127.0.0.1:${GATEWAY_PORT:-8080}:8080"
