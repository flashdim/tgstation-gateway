<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>LazorGator Party</title>
    <link rel="stylesheet" href="style.css">
    <script defer src="slots.js"></script>
    <script defer src="page.js"></script>
    <script defer src="wizard.js"></script>
  </head>
  <body>
    <div class="space" aria-hidden="true">
      <img class="clown" src="clown.webp" alt="">
      <img class="space-sprite alien" src="https://github.com/user-attachments/assets/c3955ad9-14d8-4d13-a967-ab7e95af6f03" alt="">
      <img class="space-sprite operative" src="https://github.com/user-attachments/assets/89ee354c-4b68-4661-944b-0c88a11a8411" alt="">
      <img class="narsie" src="https://github.com/user-attachments/assets/c84eccc9-775b-4f0a-996d-f62a18193f43" alt="">
    </div>
    <div class="wizard-layer">
      <div class="wizard">
        <button id="wizard-button" type="button" aria-label="Activate wizard">
          <img src="https://github.com/user-attachments/assets/fd8813b9-0dac-47b9-ab8f-40c0070f6bbc" alt="">
        </button>
        <span id="wizard-bubble" class="wizard-bubble" role="status" hidden></span>
      </div>
    </div>
    <main>
      <header>
        <div class="logo" aria-label="LazorGator Party">
          <span aria-hidden="true">✦</span> LAZORGATOR <span>PARTY</span>
        </div>
        <p class="eyebrow">YOUR WINDOW TO SPACE STATION 13</p>
        <h1>Choose a session</h1>
        <p>Pick an available slot or watch an active session.</p>
      </header>
      <section aria-label="Player slots">
        <div id="slots" class="slots"></div>
        <p id="config-error" class="notice" hidden></p>
        <noscript><p class="notice">JavaScript is required to display configured slots.</p></noscript>
      </section>
      <footer>
        <p>Test configuration only. Status is not live and access is not enforced by this page.</p>
        <p><a href="ATTRIBUTION.md">Artwork attributions and licenses</a>.</p>
      </footer>
    </main>
  </body>
</html>
