name: Publish container images

on:
  release:
    types: [published]

permissions:
  contents: read
  packages: write

jobs:
  unit-tests:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Check out release tag
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          ref: refs/tags/${{ github.event.release.tag_name }}
          persist-credentials: false

      - name: Run unit tests
        run: python3 -m unittest discover -s tests -v

      - name: Test fixed account isolation
        env:
          GATEWAY_DOCKER_TEST_IMAGE: alpine:3.20@sha256:d9e853e87e55526f6b2917df91a2115c36dd7c696a35be12163d44e6e2a4b6bc
        run: |
          docker pull "$GATEWAY_DOCKER_TEST_IMAGE"
          python3 -m unittest discover -s tests -p test_fixed_slots.py -v

  player-image:
    needs: unit-tests
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Check out release tag
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          ref: refs/tags/${{ github.event.release.tag_name }}
          persist-credentials: false

      - name: Generate image metadata
        id: meta
        uses: docker/metadata-action@c299e40c65443455700f0fdfc63efafe5b349051 # v5
        with:
          images: ghcr.io/${{ github.repository }}
          flavor: latest=false
          tags: |
            type=ref,event=tag
            type=raw,value=latest,enable=${{ !github.event.release.prerelease }}

      - name: Set up Buildx
        uses: docker/setup-buildx-action@8d2750c68a42422c14e847fe6c8ac0403b4cbd6f # v3

      - name: Restore Wine prefix cache
        uses: actions/cache/restore@0057852bfaa89a56745cba8c7296529d2fc39830 # v4
        with:
          path: ${{ runner.temp }}/wine-prefix-cache/prefix.tar.gz
          key: wine-prefix-v4-proton-${{ hashFiles('Dockerfile', 'container/wine-proton.env', 'container/install-client.sh', 'container/install-byond.sh', 'container/install-graphics.sh') }}

      - name: Prepare Wine prefix cache directory
        run: mkdir -p "$RUNNER_TEMP/wine-prefix-cache"

      - name: Restore Proton Wine download cache
        id: wine-download
        uses: actions/cache/restore@0057852bfaa89a56745cba8c7296529d2fc39830 # v4
        with:
          path: ${{ runner.temp }}/wine-download-cache/wine-proton.tar.xz
          key: wine-download-v1-${{ hashFiles('container/wine-proton.env') }}

      - name: Download or verify Proton Wine
        run: sh container/download-wine.sh "$RUNNER_TEMP/wine-download-cache"

      - name: Save Proton Wine download cache
        if: steps.wine-download.outputs.cache-hit != 'true'
        uses: actions/cache/save@0057852bfaa89a56745cba8c7296529d2fc39830 # v4
        with:
          path: ${{ runner.temp }}/wine-download-cache/wine-proton.tar.xz
          key: ${{ steps.wine-download.outputs.cache-primary-key }}

      - name: Build release image
        uses: docker/build-push-action@10e90e3645eae34f1e60eeb005ba3a3d33f178e8 # v6
        with:
          context: .
          platforms: linux/amd64
          load: true
          tags: tgstation-gateway-player:release
          labels: ${{ steps.meta.outputs.labels }}
          build-contexts: |
            wine-prefix-cache=${{ runner.temp }}/wine-prefix-cache
            wine-download-cache=${{ runner.temp }}/wine-download-cache

      - name: Smoke-test release image
        run: bash tests/smoke-container.sh tgstation-gateway-player:release

      - name: Smoke-test Wayland release session
        run: bash tests/smoke-wayland.sh tgstation-gateway-player:release

      - name: Check release Wine runtime
        run: |
          docker run --rm --entrypoint sh \
            -v "$PWD/tests/check-wine-runtime.sh:/tmp/check-wine-runtime.sh:ro" \
            tgstation-gateway-player:release /tmp/check-wine-runtime.sh

      - name: Log in to GHCR
        uses: docker/login-action@c94ce9fb468520275223c153574b00df6fe4bcc9 # v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Publish tested image
        env:
          IMAGE_TAGS: ${{ steps.meta.outputs.tags }}
        run: |
          set -euo pipefail
          if [ -z "$IMAGE_TAGS" ]; then
            echo "No release image tags were generated" >&2
            exit 1
          fi
          while IFS= read -r tag; do
            [ -n "$tag" ] || continue
            docker tag tgstation-gateway-player:release "$tag"
            docker push "$tag"
          done <<< "$IMAGE_TAGS"

  landing-image:
    needs: unit-tests
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Check out release tag
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          ref: refs/tags/${{ github.event.release.tag_name }}
          persist-credentials: false

      - name: Generate landing image metadata
        id: landing-meta
        uses: docker/metadata-action@c299e40c65443455700f0fdfc63efafe5b349051 # v5
        with:
          images: ghcr.io/${{ github.repository }}-landing
          flavor: latest=false
          tags: |
            type=ref,event=tag
            type=raw,value=latest,enable=${{ !github.event.release.prerelease }}

      - name: Set up Buildx
        uses: docker/setup-buildx-action@8d2750c68a42422c14e847fe6c8ac0403b4cbd6f # v3

      - name: Build release landing image
        uses: docker/build-push-action@10e90e3645eae34f1e60eeb005ba3a3d33f178e8 # v6
        with:
          context: .
          file: landing/Dockerfile
          platforms: linux/amd64
          load: true
          tags: tgstation-gateway-landing:release
          labels: ${{ steps.landing-meta.outputs.labels }}

      - name: Smoke-test release landing image
        run: bash tests/smoke-landing.sh tgstation-gateway-landing:release

      - name: Log in to GHCR
        uses: docker/login-action@c94ce9fb468520275223c153574b00df6fe4bcc9 # v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Publish tested landing image
        env:
          IMAGE_TAGS: ${{ steps.landing-meta.outputs.tags }}
        run: |
          set -euo pipefail
          if [ -z "$IMAGE_TAGS" ]; then
            echo "No release landing image tags were generated" >&2
            exit 1
          fi
          while IFS= read -r tag; do
            [ -n "$tag" ] || continue
            docker tag tgstation-gateway-landing:release "$tag"
            docker push "$tag"
          done <<< "$IMAGE_TAGS"

  manager-image:
    needs: unit-tests
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Check out release tag
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          ref: refs/tags/${{ github.event.release.tag_name }}
          persist-credentials: false

      - name: Generate manager image metadata
        id: manager-meta
        uses: docker/metadata-action@c299e40c65443455700f0fdfc63efafe5b349051 # v5
        with:
          images: ghcr.io/${{ github.repository }}-manager
          flavor: latest=false
          tags: |
            type=ref,event=tag
            type=raw,value=latest,enable=${{ !github.event.release.prerelease }}

      - name: Set up Buildx
        uses: docker/setup-buildx-action@8d2750c68a42422c14e847fe6c8ac0403b4cbd6f # v3

      - name: Build release manager image
        uses: docker/build-push-action@10e90e3645eae34f1e60eeb005ba3a3d33f178e8 # v6
        with:
          context: .
          file: examples/manager.Dockerfile
          platforms: linux/amd64
          load: true
          tags: tgstation-gateway-manager:release
          labels: ${{ steps.manager-meta.outputs.labels }}

      - name: Test release manager image and Traefik slot routing
        env:
          GATEWAY_TEST_MANAGER_IMAGE: tgstation-gateway-manager:release
          GATEWAY_TEST_BACKEND_IMAGE: python:3.12-alpine@sha256:c5ba3deef00c7758561a0f03c26f44f10589263d40e732b8748e0d1f38f6dd89
          GATEWAY_TEST_TRAEFIK_IMAGE: traefik:v3.8.0@sha256:00c9734983e74ae35a1fc18eaee9e9da13f3dde95c4e45b3b8c3b60e0dbd2d17
          GATEWAY_TEST_REGISTRY_IMAGE: registry:3@sha256:82f6ff4a7f982960c8aa51617fea3aabc485df6e55cce80d22deb1de36f1bc3c
        run: |
          docker pull "$GATEWAY_TEST_BACKEND_IMAGE"
          docker pull "$GATEWAY_TEST_TRAEFIK_IMAGE"
          docker pull "$GATEWAY_TEST_REGISTRY_IMAGE"
          python3 -m unittest discover -s tests -p test_slot_router.py -v

      - name: Log in to GHCR
        uses: docker/login-action@c94ce9fb468520275223c153574b00df6fe4bcc9 # v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Publish tested manager image
        env:
          IMAGE_TAGS: ${{ steps.manager-meta.outputs.tags }}
        run: |
          set -euo pipefail
          if [ -z "$IMAGE_TAGS" ]; then
            echo "No release manager image tags were generated" >&2
            exit 1
          fi
          while IFS= read -r tag; do
            [ -n "$tag" ] || continue
            docker tag tgstation-gateway-manager:release "$tag"
            docker push "$tag"
          done <<< "$IMAGE_TAGS"
