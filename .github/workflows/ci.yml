name: Container CI

on:
  pull_request:
  push:
    branches: [main]
  workflow_dispatch:
    inputs:
      check_byond_key:
        description: Run the mocked runtime BYOND key provisioning check
        type: boolean
        default: false

permissions:
  contents: read

jobs:
  formatting:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Check out source
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false

      - name: Install pre-commit
        run: |
          python3 -m venv "$RUNNER_TEMP/format-env"
          "$RUNNER_TEMP/format-env/bin/python" -m pip install pre-commit==4.3.0

      - name: Check formatting
        run: |
          "$RUNNER_TEMP/format-env/bin/pre-commit" run --all-files --show-diff-on-failure

  unit-tests:
    needs: formatting
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Check out source
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false

      - name: Run unit tests
        run: python3 -m unittest discover -s tests -v

      - name: Test fixed account isolation
        env:
          GATEWAY_DOCKER_TEST_IMAGE: alpine:3.20@sha256:d9e853e87e55526f6b2917df91a2115c36dd7c696a35be12163d44e6e2a4b6bc
        run: |
          docker pull "$GATEWAY_DOCKER_TEST_IMAGE"
          python3 -m unittest discover -s tests -p test_fixed_slots.py -v

      - name: Check runtime BYOND key provisioning
        if: ${{ github.event_name == 'workflow_dispatch' && inputs.check_byond_key }}
        env:
          BYOND_TEST_KEY: ${{ secrets.BYOND_TEST_KEY }}
        run: |
          set -eu
          if [ -z "$BYOND_TEST_KEY" ]; then
            echo "Skipping BYOND key provisioning check: test secrets unavailable."
            exit 0
          fi
          umask 077
          key_file="$RUNNER_TEMP/byond-test-key-$$"
          set -C
          : > "$key_file"
          set +C
          trap 'rm -f -- "$key_file"' EXIT
          printf '%s' "$BYOND_TEST_KEY" > "$key_file"
          unset BYOND_TEST_KEY
          export BYOND_TEST_KEY_FILE="$key_file"
          python3 -m unittest discover -s tests -p test_run_client.py -k test_provisions_runtime_secret_file -v

  landing-screenshot:
    needs: unit-tests
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Check out source
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false

      - name: Build landing page for screenshots
        run: docker build -f landing/Dockerfile -t tgstation-gateway-landing:screenshot .

      - name: Start landing page
        run: |
          docker run -d --name landing -p 127.0.0.1:8000:8000 \
            -e GATEWAY_PLAY_HOST=play.example.test \
            -e GATEWAY_SLOT_COUNT=8 \
            -e GATEWAY_SLOT_PATH='/{account}/' \
            tgstation-gateway-landing:screenshot
          curl -fsS --retry 30 --retry-delay 1 --retry-all-errors http://127.0.0.1:8000/slots.js >/dev/null

      - name: Capture screenshots
        run: |
          python3 -m venv "$RUNNER_TEMP/shot-env"
          "$RUNNER_TEMP/shot-env/bin/pip" install playwright==1.65.2
          "$RUNNER_TEMP/shot-env/bin/playwright" install --with-deps chromium
          mkdir -p screenshots
          "$RUNNER_TEMP/shot-env/bin/python" - <<'EOF'
          from playwright.sync_api import sync_playwright

          with sync_playwright() as p:
              browser = p.chromium.launch()
              for name, size in (("desktop", (1280, 900)), ("mobile", (390, 844))):
                  page = browser.new_page(viewport={"width": size[0], "height": size[1]})
                  page.goto("http://127.0.0.1:8000/")
                  page.wait_for_selector(".slot")
                  page.screenshot(path=f"screenshots/landing-{name}.png", full_page=True)
              browser.close()
          EOF

      - name: Upload screenshots
        if: ${{ !cancelled() }}
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: landing-screenshots
          path: screenshots/*.png
          if-no-files-found: error

      - name: Stop landing page
        if: ${{ always() }}
        run: docker rm -f landing

  landing-image:
    needs: formatting
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: read
      packages: write
    steps:
      - name: Check out source
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false

      - name: Set up Buildx
        uses: docker/setup-buildx-action@8d2750c68a42422c14e847fe6c8ac0403b4cbd6f # v3

      - name: Log in to GHCR
        if: >-
          ((github.event_name == 'push' || github.event_name == 'workflow_dispatch') && github.ref == 'refs/heads/main') ||
          (github.event_name == 'pull_request' && github.event.pull_request.head.repo.full_name == github.repository)
        uses: docker/login-action@c94ce9fb468520275223c153574b00df6fe4bcc9 # v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build landing image
        uses: docker/build-push-action@10e90e3645eae34f1e60eeb005ba3a3d33f178e8 # v6
        with:
          context: .
          file: landing/Dockerfile
          platforms: linux/amd64
          load: true
          tags: tgstation-gateway-landing:ci

      - name: Publish development landing image
        if: >-
          ((github.event_name == 'push' || github.event_name == 'workflow_dispatch') && github.ref == 'refs/heads/main') ||
          (github.event_name == 'pull_request' && github.event.pull_request.head.repo.full_name == github.repository)
        env:
          IMAGE: ghcr.io/${{ github.repository }}-landing:${{ github.event_name == 'pull_request' && format('dev-pr{0}', github.event.pull_request.number) || 'dev' }}
        run: |
          docker tag tgstation-gateway-landing:ci "$IMAGE"
          docker push "$IMAGE"

      - name: Smoke-test landing image
        run: bash tests/smoke-landing.sh tgstation-gateway-landing:ci

  image:
    needs: formatting
    runs-on: ubuntu-latest
    timeout-minutes: 30
    permissions:
      contents: read
      packages: write
    steps:
      - name: Check out source
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false

      - name: Set up Buildx
        uses: docker/setup-buildx-action@8d2750c68a42422c14e847fe6c8ac0403b4cbd6f # v3

      - name: Restore Wine prefix cache
        id: wine-cache
        uses: actions/cache/restore@0057852bfaa89a56745cba8c7296529d2fc39830 # v4
        with:
          path: ${{ runner.temp }}/wine-prefix-cache/prefix.tar.gz
          key: wine-prefix-v4-proton-${{ hashFiles('Dockerfile', 'container/wine-proton.env', 'container/install-client.sh', 'container/install-byond.sh', 'container/install-graphics.sh') }}

      - name: Prepare Wine prefix cache directory
        run: mkdir -p "$RUNNER_TEMP/wine-prefix-cache"

      - name: Restore Proton Wine download cache
        id: wine-download
        uses: actions/cache/restore@0057852bfaa89a56745cba8c7296529d2fc39830 # v4
        with:
          path: ${{ runner.temp }}/wine-download-cache/wine-proton.tar.xz
          key: wine-download-v1-${{ hashFiles('container/wine-proton.env') }}

      - name: Download or verify Proton Wine
        run: sh container/download-wine.sh "$RUNNER_TEMP/wine-download-cache"

      - name: Save Proton Wine download cache
        if: steps.wine-download.outputs.cache-hit != 'true'
        uses: actions/cache/save@0057852bfaa89a56745cba8c7296529d2fc39830 # v4
        with:
          path: ${{ runner.temp }}/wine-download-cache/wine-proton.tar.xz
          key: ${{ steps.wine-download.outputs.cache-primary-key }}

      - name: Log in to GHCR
        if: >-
          ((github.event_name == 'push' || github.event_name == 'workflow_dispatch') && github.ref == 'refs/heads/main') ||
          (github.event_name == 'pull_request' && github.event.pull_request.head.repo.full_name == github.repository)
        uses: docker/login-action@c94ce9fb468520275223c153574b00df6fe4bcc9 # v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build player image
        uses: docker/build-push-action@10e90e3645eae34f1e60eeb005ba3a3d33f178e8 # v6
        with:
          context: .
          platforms: linux/amd64
          load: true
          tags: tgstation-gateway-player:ci
          build-contexts: |
            wine-prefix-cache=${{ runner.temp }}/wine-prefix-cache
            wine-download-cache=${{ runner.temp }}/wine-download-cache

      - name: Publish development image
        if: >-
          ((github.event_name == 'push' || github.event_name == 'workflow_dispatch') && github.ref == 'refs/heads/main') ||
          (github.event_name == 'pull_request' && github.event.pull_request.head.repo.full_name == github.repository)
        env:
          IMAGE: ghcr.io/${{ github.repository }}:${{ github.event_name == 'pull_request' && format('dev-pr{0}', github.event.pull_request.number) || 'dev' }}
        run: |
          docker tag tgstation-gateway-player:ci "$IMAGE"
          docker push "$IMAGE"

      - name: Validate Compose example
        run: |
          docker compose -f examples/compose.yaml config --quiet
          docker compose -f examples/compose.yaml config --format json |
            python3 -c 'import json, sys; assert json.load(sys.stdin)["services"]["player"]["security_opt"] == ["seccomp=./seccomp.json"]'
          docker compose -f examples/compose.yaml config --format json |
            python3 -c 'import json, sys; assert "landing" not in json.load(sys.stdin)["services"]'
          docker compose -f examples/compose.yaml --profile landing config --format json |
            python3 -c 'import json, sys; ports = json.load(sys.stdin)["services"]["landing"]["ports"]; assert [p["host_ip"] for p in ports] == ["127.0.0.1"]'
          python3 -c 'import json; p=json.load(open("examples/seccomp.json")); assert p["defaultAction"] == "SCMP_ACT_ERRNO" and any(rule["names"] == ["socket"] and rule["action"] == "SCMP_ACT_ALLOW" and rule.get("includes", {}).get("arches") == ["SCMP_ARCH_X86"] for rule in p["syscalls"])'
          DRI_RENDER_GID=123 docker compose -f examples/compose.yaml -f examples/compose.gpu.yaml config --quiet

      - name: Smoke-test player image
        id: smoke-x11
        run: bash tests/smoke-container.sh tgstation-gateway-player:ci

      - name: Smoke-test Wayland session
        id: smoke-wayland
        if: ${{ !cancelled() && steps.smoke-x11.outcome != 'skipped' }}
        run: bash tests/smoke-wayland.sh tgstation-gateway-player:ci

      - name: Trace startup after a smoke-test failure
        if: ${{ failure() && (steps.smoke-x11.outcome == 'failure' || steps.smoke-wayland.outcome == 'failure') }}
        timeout-minutes: 5
        run: |
          mkdir -p "$RUNNER_TEMP/wine-traces"
          docker version > "$RUNNER_TEMP/wine-traces/docker-version.txt"
          docker info > "$RUNNER_TEMP/wine-traces/docker-info.txt"
          docker image inspect tgstation-gateway-player:ci > "$RUNNER_TEMP/wine-traces/image.json"
          docker build -t tgstation-gateway-player:trace - <<'EOF'
          FROM tgstation-gateway-player:ci
          USER root
          RUN selkies-privileged-files release && \
              apt-get update && \
              apt-get install -y --no-install-recommends strace && \
              apt-get clean && rm -rf /var/lib/apt/lists/* && \
              selkies-privileged-files restore
          RUN mv /etc/service/byond/run /usr/local/bin/run-byond-untraced && \
              printf '%s\n' '#!/bin/sh' \
                'exec strace -f -s 128 -o /tmp/wine.trace /usr/local/bin/run-byond-untraced' \
                > /etc/service/byond/run && \
              chmod 755 /etc/service/byond/run
          USER 1000
          EOF
          container=""
          trap 'if [ -n "$container" ]; then docker rm -f "$container"; fi' EXIT
          result=0
          for profile in default custom unconfined; do
            security_args=()
            case "$profile" in
              custom) security_args+=(--security-opt seccomp=examples/seccomp.json) ;;
              unconfined) security_args+=(--security-opt seccomp=unconfined) ;;
            esac
            for wayland in false true; do
              directory="$RUNNER_TEMP/wine-traces/$profile/wayland-$wayland"
              mkdir -p "$directory"
              container="$(docker run -d --init --shm-size=2g \
                "${security_args[@]}" \
                -e SELKIES_WAYLAND="$wayland" tgstation-gateway-player:trace)"
              sleep 30
              docker logs "$container" > "$directory/container.log" 2>&1
              docker inspect "$container" > "$directory/container.json"
              if ! docker cp "$container:/tmp/wine.trace" "$directory/wine.trace"; then
                echo "No startup trace collected for seccomp=$profile SELKIES_WAYLAND=$wayland" >&2
                result=1
              fi
              docker rm -f "$container"
              container=""
            done
          done
          exit "$result"

      - name: Upload startup diagnostics
        if: ${{ always() && (steps.smoke-x11.outcome == 'failure' || steps.smoke-wayland.outcome == 'failure') }}
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: wine-startup-diagnostics
          path: ${{ runner.temp }}/wine-traces/
          if-no-files-found: error
          retention-days: 7

      - name: Check Wine and 32-bit runtime libraries
        run: |
          docker run --rm --entrypoint sh \
            -v "$PWD/tests/check-wine-runtime.sh:/tmp/check-wine-runtime.sh:ro" \
            tgstation-gateway-player:ci /tmp/check-wine-runtime.sh

      - name: Archive Wine prefix
        if: steps.wine-cache.outputs.cache-hit != 'true'
        run: |
          docker run --rm --entrypoint tar tgstation-gateway-player:ci \
            --exclude='./drive_c/Program Files (x86)/BYOND' \
            -C /home/ubuntu/.wine -czf - . > "$RUNNER_TEMP/wine-prefix-cache/prefix.tar.gz"

      - name: Save Wine prefix cache
        if: steps.wine-cache.outputs.cache-hit != 'true'
        uses: actions/cache/save@0057852bfaa89a56745cba8c7296529d2fc39830 # v4
        with:
          path: ${{ runner.temp }}/wine-prefix-cache/prefix.tar.gz
          key: ${{ steps.wine-cache.outputs.cache-primary-key }}

      - name: Report built image size
        run: |
          docker image inspect \
            --format='{{index .RepoTags 0}} {{.Size}} bytes' \
            tgstation-gateway-player:ci
