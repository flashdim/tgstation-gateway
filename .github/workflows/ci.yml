name: Container CI

on:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  image:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Check out source
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false

      - name: Run unit tests
        run: python3 -m unittest discover -s tests -v

      - name: Validate Compose example
        run: docker compose config --quiet

      - name: Set up Buildx
        uses: docker/setup-buildx-action@8d2750c68a42422c14e847fe6c8ac0403b4cbd6f # v3

      - name: Build player image
        uses: docker/build-push-action@10e90e3645eae34f1e60eeb005ba3a3d33f178e8 # v6
        with:
          context: .
          platforms: linux/amd64
          load: true
          tags: tgstation-gateway-player:ci
          build-args: |
            BYOND_DOWNLOAD_BASE_URL=https://byond-builds.dm-lang.org

      - name: Smoke-test player image
        run: bash tests/smoke-container.sh tgstation-gateway-player:ci
